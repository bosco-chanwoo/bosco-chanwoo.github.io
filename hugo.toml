baseURL = "https://bosco-chanwoo.github.io/"
languageCode = "ko-kr"
title = "bosco"
theme = "PaperMod"

[pagination]
  pagerSize = 10

[params]
  defaultTheme = "light"
  ShowToc = true
  math = true
  TocOpen = true
  TocSidebar = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true

  # 홈 소개 카드
  [params.homeInfoParams]
    Title = "🐇 Welcome to STATsDL Playground"
    Content = "This is a page for posting statistical deep learning contents. "


  # 홈에 최신 글이 보이도록 (study/research 둘 다 포함)
  mainSections = ["study", "research"]

 
  # (선택) 이메일 아이콘
  [[params.socialIcons]]
  name = "email"
  url = "mailto:bosco999@snu.ac.kr"

[menu]

  [[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 10

  [[menu.main]]
    name = "Study"
    url = "/study/"
    weight = 20
